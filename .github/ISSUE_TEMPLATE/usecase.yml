name: "ユースケース"
description: "利用者価値を実装可能なIssueにする"
title: "[usecase] "
labels:
  - "usecase"

body:
  - type: textarea
    id: purpose
    attributes:
      label: "利用者と目的"
      description: "誰が、何をできるようになるか"
    validations:
      required: true

  - type: textarea
    id: preconditions
    attributes:
      label: "前提条件"
      description: "利用環境、必要な状態、権限"
    validations:
      required: true

  - type: textarea
    id: flow
    attributes:
      label: "基本フロー"
      description: "目的を達成するまでの操作と結果"
    validations:
      required: true

  - type: textarea
    id: alternative_flow
    attributes:
      label: "代替フロー・異常フロー"
      description: "入力不正、権限不足、処理失敗など。該当しなければ理由を記載"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "受入条件"
      description: "入力・操作に対する観測可能な結果をチェックリストで記載"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "対象範囲・対象外"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "依存関係・制約・未決事項"
      description: "なければ「なし」と記載"
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "ユースケースID・関連Issue・文書"
    validations:
      required: false

  - type: checkboxes
    id: ready
    attributes:
      label: "Ready確認"
      description: |
        実装着手の前に満たす条件。判断の正本はこの一覧とする。
        チェックを付けるのは人間とする。AIは各項目の充足状況と根拠を示す。
        作成時点では未チェックでよい。全項目が満たされた時点でReadyとして扱う。
        条件の定義はdocs/standards/issue-management.md §5を参照する。
      options:
        - label: "目的と利用者価値が説明されている"
        - label: "対象範囲と対象外が明確である"
        - label: "受入条件が検証可能である"
        - label: "重要な仕様の不明点が解消している"
        - label: "主要な影響範囲を把握している"
        - label: "依存Issueと制約が明示されている"
        - label: "実装・検証可能な単位に分割されている"
